name: FLAKY-31 Windows lab

on:
  pull_request:
    branches: [rebuild]

permissions:
  contents: read

jobs:
  windows-m5:
    if: github.head_ref == 'devin/a79-windows-lab'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - run: go test -tags acceptance -run '^TestFeatures$' -count=5 -timeout 25m -v ./features
