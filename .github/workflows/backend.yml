name: Backend

on:
  pull_request:
    branches: [rebuild]
  push:
    branches: [rebuild]

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A push to rebuild never does: each of
# its runs has a group of its own, since one group would drop all but the newest queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Which parts of the tree a pull request touches decides which jobs run (see changes.yml); a push
# to rebuild runs all of them. conflict-markers has no condition: it also checks documentation.
# Every job builds with the newest Go 1.27 release (check-latest), as development does;
# go.mod keeps go 1.26.0 as the minimum.
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  # A merge-conflict marker left in a tracked text file, documentation included.
  conflict-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if git grep -nIE '^(<<<<<<<|=======|>>>>>>>)([[:space:]]|$)' -- .; then
            echo "::error::A merge-conflict marker is left in the files above."
            exit 1
          fi

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Folder for the diagnostics of failed scenarios
        run: echo "SOLODAWN_TEST_ARTIFACTS=$RUNNER_TEMP/diagnostics" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go vet -tags acceptance ./features/...
      - run: go test -covermode=atomic -coverprofile=cover.out ./...
      - run: go test -tags acceptance -count=1 -timeout 30m ./features/...
      # The statement coverage gate, on the files this system builds. Not blocking yet: today's tree
      # has an uncovered statement (func main of cmd/solodawn, which only the acceptance tests run).
      # The step shows as failed and lists the statements in the run summary until it is made blocking.
      - name: Uncovered product statements
        continue-on-error: true
        run: .github/scripts/go-uncovered.sh cover.out
      # The cyclomatic complexity limit of .project-standard/gates.toml: crap = 6, which at full
      # coverage is a complexity of 6. Test files, testdata, the fake CLIs and generated code are left out.
      - name: Cyclomatic complexity of the product files
        run: |
          python3 -m venv "$RUNNER_TEMP/lizard"
          "$RUNNER_TEMP/lizard/bin/pip" install --quiet lizard==1.26.1
          "$RUNNER_TEMP/lizard/bin/lizard" -l go -C 6 -w \
            -x '*_test.go' -x '*/testdata/*' -x '*/fakecli/*' -x '*/generated/*' cmd internal
      # A failed scenario leaves its logs and goroutines there (planning/contracts/diagnostics.md section 4).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/diagnostics
          retention-days: 14
          if-no-files-found: ignore

  # Data races in the acceptance suite show only under the race detector, and no other job runs it
  # there: test runs the suite without it, and the platform matrix runs only the unit tests with it.
  acceptance-race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go test -race -tags acceptance -count=1 -timeout 50m ./features/...

  # The network simulation needs root and the kernel's netns and nftables.
  # Its tests are built with the tag "netsim" and run as root here only.
  netsim:
    needs: changes
    if: needs.changes.outputs.netsim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nftables miniupnpd-nftables miniupnpc
      - run: go vet -tags netsim ./features/netsim
      - run: go test -c -tags netsim -o netsim.test ./features/netsim
      # A test binary run directly has no timeout unless it is given one.
      - run: sudo ./netsim.test -test.v -test.count=1 -test.timeout=10m

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test
      - run: pnpm build

  cross-compile:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go build ./cmd/solodawn ./internal/host/fakecli/claude ./internal/host/fakecli/codex
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
      # Vet compiles the tests too, so the macOS and Windows test files build somewhere.
      - run: go vet ./... && go vet -tags acceptance ./features/...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

  # The Go checks on Windows and macOS, so the files built only there run somewhere. gofmt runs on
  # macOS only: Git for Windows checks files out with CRLF unless told not to, as below.
  other-os:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Folder for the diagnostics of failed scenarios
        run: echo "SOLODAWN_TEST_ARTIFACTS=$RUNNER_TEMP/diagnostics" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: out=$(gofmt -l cmd internal features); echo "$out"; test -z "$out"
      - run: go vet ./...
      - run: go vet -tags acceptance ./features/...
      - run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - run: go test -tags acceptance -count=1 -timeout 30m ./features/...
      # Statement coverage of the files that only this system builds, from the unit tests above.
      # The percentage comes first: setup-go's problem matcher takes "<file>.go: <text>" for an error.
      - name: Coverage of the files built only here
        run: |
          awk -F'[:, ]' 'NR > 1 && $1 ~ /_(windows|darwin|unix)\.go$/ { n[$1] += $4; if ($5 > 0) c[$1] += $4 }
            END { for (f in n) { g = f; sub(/^github\.com\/huanchong-99\/SoloDawn\//, "", g)
              printf "%.1f%% of %d statements in %s\n", 100 * c[f] / n[f], n[f], g } }' cover.out |
            sort -k5 | tee -a "$GITHUB_STEP_SUMMARY"
      # The statement coverage gate, on the files this system builds (see the Linux job).
      - name: Uncovered Windows product statements
        if: runner.os == 'Windows'
        run: .github/scripts/go-uncovered.sh cover.out
      - name: Uncovered macOS product statements
        if: runner.os == 'macOS'
        continue-on-error: true
        run: .github/scripts/go-uncovered.sh cover.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: cover.out
          if-no-files-found: error
      # A failed scenario leaves its logs and goroutines there (planning/contracts/diagnostics.md section 4).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/diagnostics
          retention-days: 14
          if-no-files-found: ignore
