name: Release

# For a pushed vMAJOR.MINOR.PATCH tag, or release candidate tag
# vMAJOR.MINOR.PATCH-rc.N, builds the six released artifacts stamped with the
# tag (four Linux and Windows binaries plus two zipped macOS SoloDawn.app
# bundles) and their SHA256SUMS, and keeps them as a workflow artifact. It
# creates no release and no tag.
#
# It runs on macOS because the two darwin apps are assembled into SoloDawn.app
# with the native Swift helper SoloDawnPermissions and signed ad hoc as
# org.solodawn.node. The Linux and Windows binaries are cross-compiled exactly
# as before.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # The tag filters above cannot refuse leading zeros: v01.2.3 and v1.2.3-rc.01 match them.
      - name: Refuse a tag that is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N
        run: '[[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      # No cache: the released files are built from the tagged sources and
      # fresh downloads only, never from what another run left in a cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The newest 1.27 release, as in every workflow; go.mod keeps go 1.26.0 as the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Build the embedded web client and include the installation guide
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp ../install.md ../internal/node/webdist/

      - name: Build the six Go binaries stamped with the tag
        run: |
          mkdir -p dist "$RUNNER_TEMP/darwin"
          for os in linux darwin windows; do
            suffix=
            cgo=0
            if [[ "$os" == windows ]]; then suffix=.exe; fi
            if [[ "$os" == darwin ]]; then cgo=1; fi
            for arch in amd64 arm64; do
              out="dist/solodawn_${GITHUB_REF_NAME}_${os}_${arch}${suffix}"
              if [[ "$os" == darwin ]]; then
                out="$RUNNER_TEMP/darwin/solodawn_${GITHUB_REF_NAME}_${os}_${arch}"
              fi
              # The deployment target is Go's own macOS minimum; Apple's linker would use the runner's.
              CGO_ENABLED="$cgo" MACOSX_DEPLOYMENT_TARGET=13.0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X github.com/huanchong-99/SoloDawn/internal/node.Version=$GITHUB_REF_NAME" \
                -o "$out" ./cmd/solodawn
            done
          done
          test "$("$RUNNER_TEMP/darwin/solodawn_${GITHUB_REF_NAME}_darwin_arm64" version)" = "$GITHUB_REF_NAME"

      - name: Refuse a binary built from a modified work tree
        run: |
          for bin in dist/solodawn_* "$RUNNER_TEMP"/darwin/solodawn_*; do
            go version -m "$bin" | grep -Fx $'\tbuild\tvcs.modified=false'
          done

      - name: Build and pack SoloDawn.app for macOS
        run: |
          for arch in amd64 arm64; do
            ./macos/build-app.sh "$GITHUB_REF_NAME" "$arch" \
              "$RUNNER_TEMP/darwin/solodawn_${GITHUB_REF_NAME}_darwin_${arch}" dist
          done

      - name: Checksum the six released files
        working-directory: dist
        run: |
          shasum -a 256 solodawn_* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solodawn_${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
