name: Release

# For a pushed vMAJOR.MINOR.PATCH tag, or release candidate tag
# vMAJOR.MINOR.PATCH-rc.N, builds the six binaries stamped with the tag and
# their SHA256SUMS, and keeps them as a workflow artifact. It creates no
# release and no tag.
#
# It runs on macOS because the two darwin binaries are linked by Apple's linker
# with cmd/solodawn/Info.plist embedded and signed ad hoc as org.solodawn.node:
# the macOS Application Firewall keys its decisions on that identity, and every
# other Go binary shares the identity a.out. The Linux and Windows binaries are
# cross-compiled exactly as before.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # The tag filters above cannot refuse leading zeros: v01.2.3 and v1.2.3-rc.01 match them.
      - name: Refuse a tag that is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N
        run: '[[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      # No cache: the released files are built from the tagged sources and
      # fresh downloads only, never from what another run left in a cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The newest 1.27 release, as in every workflow; go.mod keeps go 1.26.0 as the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Build the embedded web client and include the installation guide
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp ../install.md ../internal/node/webdist/

      - name: Build six binaries stamped with the tag
        run: |
          mkdir dist
          for os in linux darwin windows; do
            suffix=
            cgo=0
            link=
            if [[ "$os" == windows ]]; then suffix=.exe; fi
            if [[ "$os" == darwin ]]; then
              cgo=1
              link="-linkmode=external -extldflags '-sectcreate __TEXT __info_plist $PWD/cmd/solodawn/Info.plist'"
            fi
            for arch in amd64 arm64; do
              # The deployment target is Go's own macOS minimum; Apple's linker would use the runner's.
              CGO_ENABLED="$cgo" MACOSX_DEPLOYMENT_TARGET=13.0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X github.com/huanchong-99/SoloDawn/internal/node.Version=$GITHUB_REF_NAME $link" \
                -o "dist/solodawn_${GITHUB_REF_NAME}_${os}_${arch}${suffix}" ./cmd/solodawn
            done
          done
          for arch in amd64 arm64; do
            bin="dist/solodawn_${GITHUB_REF_NAME}_darwin_${arch}"
            codesign -s - -f "$bin"
            codesign -dv "$bin" 2>&1 | grep -Fx Identifier=org.solodawn.node
          done
          test "$("dist/solodawn_${GITHUB_REF_NAME}_darwin_arm64" version)" = "$GITHUB_REF_NAME"

      - name: Refuse a binary built from a modified work tree
        run: |
          for bin in dist/solodawn_*; do
            go version -m "$bin" | grep -Fx $'\tbuild\tvcs.modified=false'
          done

      - name: Checksum the six binaries
        working-directory: dist
        run: shasum -a 256 solodawn_* > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solodawn_${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
