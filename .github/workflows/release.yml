name: Release

# For a pushed vMAJOR.MINOR.PATCH tag, builds the six binaries stamped with the
# tag and their SHA256SUMS, and keeps them as a workflow artifact. It creates
# no release and no tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      # No cache: the released files are built from the tagged sources and
      # fresh downloads only, never from what another run left in a cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The newest 1.27 release, as in every workflow; go.mod keeps go 1.26.0 as the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Build the embedded web client and include the installation guide
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp ../install.md ../internal/node/webdist/

      - name: Build six binaries stamped with the tag
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for os in linux darwin windows; do
            suffix=
            if [[ "$os" == windows ]]; then suffix=.exe; fi
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X github.com/huanchong-99/SoloDawn/internal/node.Version=$GITHUB_REF_NAME" \
                -o "dist/solodawn_${GITHUB_REF_NAME}_${os}_${arch}${suffix}" ./cmd/solodawn
            done
          done
          test "$("dist/solodawn_${GITHUB_REF_NAME}_linux_amd64" version)" = "$GITHUB_REF_NAME"

      - name: Checksum the six binaries
        working-directory: dist
        run: sha256sum solodawn_* > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solodawn_${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
