name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v0[0-9]*.*.*'
      - '!v*.0[0-9]*.*'
      - '!v*.*.0[0-9]*'

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the embedded web client and include the installation guide
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp ../install.md ../internal/node/webdist/

      - name: Stamp the version for release builds
        run: |
          sed "s/^const Version = .*/const Version = \"$GITHUB_REF_NAME\"/" internal/node/node.go > "$RUNNER_TEMP/node.go"
          jq -n --arg file "$RUNNER_TEMP/node.go" '{Replace: {"internal/node/node.go": $file}}' > "$RUNNER_TEMP/version.json"

      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for os in linux darwin windows; do
            suffix=
            if [[ "$os" == windows ]]; then suffix=.exe; fi
            for arch in amd64 arm64; do
              asset="solodawn_${GITHUB_REF_NAME}_${os}_${arch}${suffix}"
              GOOS="$os" GOARCH="$arch" go build -overlay "$RUNNER_TEMP/version.json" \
                -trimpath -ldflags='-s -w' -o "dist/$asset" ./cmd/solodawn
            done
          done
          test "$("dist/solodawn_${GITHUB_REF_NAME}_linux_amd64" version)" = "$GITHUB_REF_NAME"

      - name: Checksum the six binaries
        working-directory: dist
        run: sha256sum solodawn_* > SHA256SUMS

      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --verify-tag --generate-notes -- "$GITHUB_REF_NAME" dist/* install.md
