name: Release

# For a pushed vMAJOR.MINOR.PATCH tag, builds the six binaries stamped with the
# tag and their SHA256SUMS, and keeps them as a workflow artifact. It creates
# no release and no tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      # No cache: the released files are built from the tagged sources and
      # fresh downloads only, never from what another run left in a cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the embedded web client and include the installation guide
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp ../install.md ../internal/node/webdist/

      - name: Build six binaries stamped with the tag
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for os in linux darwin windows; do
            suffix=
            if [[ "$os" == windows ]]; then suffix=.exe; fi
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X github.com/huanchong-99/SoloDawn/internal/node.Version=$GITHUB_REF_NAME" \
                -o "dist/solodawn_${GITHUB_REF_NAME}_${os}_${arch}${suffix}" ./cmd/solodawn
            done
          done
          test "$("dist/solodawn_${GITHUB_REF_NAME}_linux_amd64" version)" = "$GITHUB_REF_NAME"

      - name: Checksum the six binaries
        working-directory: dist
        run: sha256sum solodawn_* > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solodawn_${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
